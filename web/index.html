<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet Control</title>
<link rel="stylesheet" href="./deck.css">
<link rel="stylesheet" href="./live.css">
</head>
<body>
<div class="shell" id="app">
  <header class="titlebar">
    <div class="identity">
      <h1>Fleet Control</h1>
      <div class="hostcontext"><strong id="hostTitle">This host</strong><small id="hostSubtitle">Loading sessions</small></div>
    </div>
    <div class="tools">
      <button type="button" class="iconbutton" id="inspectorToggle" aria-controls="phaseInspector" aria-expanded="true" aria-label="Hide supervisor panel" title="Hide supervisor panel"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16m3-12v8"/></svg></button>
    </div>
  </header>
  <div class="body">
    <nav class="sidebar" id="sidebar" aria-label="Hosts and sessions"></nav>
    <main class="main" id="main">
      <div class="alert" id="alert" hidden></div>
      <div class="workarea">
        <section class="terminals" id="terminals" aria-label="Session terminals"></section>
        <aside class="inspector coordination" id="phaseInspector" aria-label="Supervisor requests and workflow">
          <header class="coordinationhead"><h2>Supervisor</h2><small id="coordContext">No run registered</small></header>
          <div class="coordinationbody">
            <section class="request" id="requests" aria-live="polite"></section>
            <section class="workflow"><div class="sectionheading"><h3>Workflow</h3><small id="runName"></small></div><p id="phaseState" class="phase-note">No run registered on this service.</p><ol id="workflowSteps"></ol></section>
            <details class="exchange" open><summary>Commands &amp; responses</summary><ol id="exchangeRows"></ol><p id="eventText" class="fineprint"></p></details>
          </div>
          <form id="instructionForm" class="instructionform"><label for="instruction">Instruction to supervisor</label><textarea id="instruction" rows="2" maxlength="4000" placeholder="Clarify the scope or give an instruction..."></textarea><div class="composerfooter"><span id="composerTarget">Select a session</span><button type="submit" id="sendInstruction" disabled>Send</button></div><p id="instructionStatus" role="status"></p></form>
        </aside>
      </div>
    </main>
  </div>
  <footer class="statusbar"><span id="status">Read-only</span><span>Live tmux output · no input path</span></footer>
</div>
<script type="module" src="./app.ts"></script>
</body>
</html>
