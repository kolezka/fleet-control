<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workstation configuration | Fleet Control</title><link rel="stylesheet" href="./deck.css"><link rel="stylesheet" href="./install.css"></head><body><main class="installpage" style="max-width:48rem;margin:2rem auto;padding:1rem"><nav aria-label="Selected workstation"><a id="overviewLink" href="./">Overview</a> · <a id="terminalsLink" href="./">Terminals</a> · <strong aria-current="page">Configuration</strong></nav><h1>Workstation configuration</h1><p id="identity"></p><form id="profileForm"><fieldset id="fields" disabled><legend>Identity and session preferences</legend><div class="field"><label for="name">Display name</label><input id="name" required maxlength="80"></div><div class="field"><label for="group">Group</label><input id="group" required maxlength="40"></div><div class="field"><label for="description">Description</label><input id="description" maxlength="160"></div><div class="field"><label for="harness">Configured harness preference</label><select id="harness"><option value="">Not configured</option><option value="deepseek-harness">DeepSeek Harness</option><option value="claude-code">Claude Code</option></select><small>This records a preference; it does not change any running session.</small></div><h2>Changes to review</h2><pre id="changes"></pre><button id="save" disabled>Save changes</button></fieldset></form><p role="status" id="notice"></p><button type="button" id="reload">Reload saved settings</button></main><script type="module" src="./workstation.ts"></script></body></html>
