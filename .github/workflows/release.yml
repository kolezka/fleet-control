# A tag like v2026.11.23 builds the release package a host installs from the page: the code at that commit,
# the pinned agent-fleet files and production node_modules, with its SHA-256 beside it.
name: release
# Pull requests that touch the workflow run the same install and tests, so a broken runner is found before a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned by commit: actions/checkout v7.0.1, oven-sh/setup-bun v2.2.0.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
          # The write token stays out of .git/config while install and tests run.
          persist-credentials: false
      - name: The tag must be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main" >&2; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      # The hosts run tmux 3.7c and 3.8, which refuse send-keys while a read-only client is attached; the
      # runner's packaged 3.6 lets it through, so the lease and delivery tests need the newer tmux. agent-fleet's
      # fleet status needs ripgrep.
      - name: ripgrep and tmux 3.8
        env:
          TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ripgrep build-essential pkg-config libevent-dev libncurses-dev bison
          curl -fsSL --retry 3 --retry-connrefused -o /tmp/tmux.tar.gz https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz
          echo "$TMUX_SHA256  /tmp/tmux.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tmux.tar.gz -C /tmp
          (cd /tmp/tmux-3.8 && ./configure --prefix=/usr/local && make -j"$(nproc)" && sudo make install)
          sudo apt-get remove -y -q tmux || true
          hash -r
          tmux -V | grep -qx "tmux 3.8"
          rg --version
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun test
      - run: bun scripts/package-release.ts . dist "$GITHUB_REF_NAME"
        if: startsWith(github.ref, 'refs/tags/')
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/fleet-control-*.tar.gz dist/fleet-control-*.tar.gz.sha256 --title "$GITHUB_REF_NAME" --notes "Package built from ${GITHUB_SHA}."
